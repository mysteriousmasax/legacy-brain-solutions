        legacyHeader.dataset.normalized = 'true';
        if (legacyHeader.getBoundingClientRect().width < 900) legacyHeader.classList.add('compact-header');
        var toggle = legacyHeader.querySelector('.mobile-toggle');
        var nav = legacyHeader.querySelector('.nav-links');
        toggle.addEventListener('click', function () { nav.classList.toggle('open'); toggle.textContent = nav.classList.contains('open') ? '×' : '☰'; });
      }
      window.setTimeout(normalize, 700);
      window.addEventListener('hashchange', function () { window.setTimeout(normalize, 120); });
